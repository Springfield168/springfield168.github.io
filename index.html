<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matthew 的個人網站</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #e0e0e0;
            background-color: #0f172a;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 24px;
        }
        hr {
            border: none;
            border-top: 1px solid #334155;
            margin: 20px 0;
        }
        h2 {
            color: #f1f5f9;
            font-size: 1.3rem;
            margin-bottom: 12px;
        }
        p {
            margin-bottom: 16px;
            color: #cbd5e1;
        }
        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .tag {
            background: #0284c7;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .btn {
            display: inline-block;
            background: #38bdf8;
            color: #0f172a;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #7dd3fc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>👋 你好，我是 Matthew！</h1>
        <p class="subtitle">Never give up on your dream</p>

        <div class="tags">
            <span class="tag">HTML/CSS</span>
            <span class="tag">GitHub Pages</span>
            <span class="tag">個人網站</span>
        </div>

        <hr>

        <h2>關於我</h2>
        <p>歡迎來到我的第一個 GitHub 個人網站！我正在學習網頁前端開發同 Git/GitHub 的應用。</p>

        <h2>我的目標</h2>
        <p>建立一個簡約、實用又好看的個人作品集與網誌。</p>

        <hr>

        <h2>聯絡我</h2>
        <p>如果你對我的項目感興趣，歡迎透過 GitHub 關注我：</p>
        <a href="https://github.com/matthew1682001" class="btn" target="_blank">造訪我的 GitHub Profile</a>
    </div>

</body>
</html>
